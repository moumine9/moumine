    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />

    <script>
      // Resolve theme before first paint to avoid FOUC.
      // Stored value is 'light' | 'dark' | 'auto'.
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "auto";
          if (pref !== "light" && pref !== "dark" && pref !== "auto") pref = "auto";
          var resolved = pref;
          if (pref === "auto") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-bs-theme", resolved);
          document.documentElement.setAttribute("data-theme-pref", pref);
        } catch (e) {
          document.documentElement.setAttribute("data-bs-theme", "light");
          document.documentElement.setAttribute("data-theme-pref", "auto");
        }
      })();
    </script>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
