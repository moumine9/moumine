<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A. Moumine Blog</title>

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="alternate icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14100e" />

    <script>
      // Resolve theme before first paint to avoid FOUC.
      // Stored value is 'light' | 'dark' | 'auto'.
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "auto";
          if (pref !== "light" && pref !== "dark" && pref !== "auto") pref = "auto";
          var resolved = pref;
          if (pref === "auto") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-bs-theme", resolved);
          document.documentElement.setAttribute("data-theme-pref", pref);
        } catch (e) {
          document.documentElement.setAttribute("data-bs-theme", "light");
          document.documentElement.setAttribute("data-theme-pref", "auto");
        }
      })();
    </script>

  </head>

  <body>
    <div id="app"></div>
    <script prerender type="module" src="/src/index.tsx"></script>
  </body>
</html>
